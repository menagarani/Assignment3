<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TAMILNADU POLICE DEPARTMENT - Demo</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #eeeeee;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            padding: 30px;
            background: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        /* TN Police logo */
        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            display: block;
            margin: 0 auto 15px;
        }

        h1 {
            font-size: 23px;
            color: #172a72;
            margin: 10px 0 8px;
        }

        .demo-warning {
            color: #c62828;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background: #172a72;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Image uploaded to GitHub as 1.jpeg -->
        <img src="1.jpeg"
             alt="Police Logo"
             class="logo">

        <h1>TAMILNADU POLICE DEPARTMENT</h1>

        <div class="demo-warning">
            DEMO / MOCKUP — NOT AN OFFICIAL WEBSITE
        </div>

        <form onsubmit="return false;">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password">
            </div>

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
