     <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMILNADU POLICE DEPARTMENT - Demo</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 380px;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 23px;
            color: #172a72;
            margin: 10px 0 20px;
        }

        .demo {
            color: #c62828;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin: 15px 0 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #172a72;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Image uploaded to GitHub as 1.jpeg -->
        <img src="1.jpeg" alt="Logo" class="logo">

        <h1>TAMILNADU POLICE DEPARTMENT</h1>

        <div class="demo">
            DEMO / MOCKUP — NOT AN OFFICIAL WEBSITE
        </div>

        <form onsubmit="return false;">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="off"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
